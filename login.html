<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - ¿Vale la pena?</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f5f7fb;
      --card: rgba(255,255,255,0.95);
      --text: #171a26;
      --muted: #747b8c;
      --border: rgba(30,35,55,0.08);
      --primary: #635bff;
      --primary-dark: #5148e8;
      --red: #e05252;
      --shadow: 0 18px 55px rgba(32,38,70,0.08);
    }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at 10% 0%, rgba(99,91,255,0.13), transparent 30%),
                  radial-gradient(circle at 90% 10%, rgba(70,180,255,0.10), transparent 28%),
                  var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      padding: 20px;
    }
    .container {
      background: var(--card);
      padding: 2.5rem;
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
    }
    .logo {
      text-align: center;
      font-size: 23px;
      font-weight: 850;
      letter-spacing: -0.7px;
      background: linear-gradient(90deg, #5148e8, #8c5cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 4px;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      background: #f0f0f5;
      padding: 4px;
      border-radius: 14px;
    }
    .tab {
      flex: 1;
      padding: 11px;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 650;
      transition: all 0.3s;
    }
    .tab.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(99,91,255,0.25);
    }
    .form-group { margin-bottom: 1rem; }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: #555c6c;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 13px 16px;
      border: 2px solid #e9ebf1;
      background: #fafaff;
      color: var(--text);
      border-radius: 14px;
      font-size: 1rem;
      transition: all 0.3s;
    }
    input:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(99,91,255,0.08);
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 0.5rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #8067ff);
      color: #fff;
      box-shadow: 0 8px 20px rgba(99,91,255,0.24);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(99,91,255,0.32);
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
      color: #a2a7b4;
      font-size: 0.85rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e9ebf1;
    }
    .btn-google {
      background: #fff;
      color: #374151;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid #e9ebf1;
      font-weight: 600;
    }
    .btn-google:hover {
      background: #f8f9fc;
      border-color: #d1d5db;
    }
    .error {
      color: var(--red);
      font-size: 0.85rem;
      margin-top: 0.75rem;
      text-align: center;
      display: none;
      padding: 8px 12px;
      background: rgba(224,82,82,0.08);
      border-radius: 10px;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .back-link:hover { color: var(--primary); }
    .hidden { display: none !important; }
  </style>
<base target="_blank">
</head>
<body>
  <div class="container">
    <div class="logo">¿Vale la pena?</div>
    <p class="subtitle">Inicia sesión para guardar tus análisis</p>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Entrar</button>
      <button class="tab" onclick="switchTab('register')">Registrarse</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm">
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="loginEmail" required placeholder="tu@email.com">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="loginPassword" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
      <p class="error" id="loginError"></p>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="hidden">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="regName" placeholder="Tu nombre">
      </div>
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="regEmail" required placeholder="tu@email.com">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="regPassword" required placeholder="Mínimo 6 caracteres" minlength="6">
      </div>
      <button type="submit" class="btn btn-primary">Crear Cuenta</button>
      <p class="error" id="regError"></p>
    </form>

    <div class="divider">o</div>

    <a href="/auth/google" class="btn btn-google">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continuar con Google
    </a>

    <a href="/" class="back-link">← Volver al análisis</a>
  </div>

  <script>
    // Check for token from Google OAuth redirect
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    if (token) {
      localStorage.setItem('token', token);
      window.location.href = '/';
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');

      if (tab === 'login') {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('registerForm').classList.add('hidden');
      } else {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.remove('hidden');
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('loginError');
      errorEl.style.display = 'none';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
          })
        });

        const data = await res.json();
        if (!data.success) throw new Error(data.error);

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('regError');
      errorEl.style.display = 'none';

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('regName').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value
          })
        });

        const data = await res.json();
        if (!data.success) throw new Error(data.error);

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
