<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - ¿Vale la pena?</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f5f7fb;
            --card: #fff;
            --text: #171a26;
            --muted: #747b8c;
            --primary: #635bff;
            --green: #18a66a;
            --red: #e05252;
            --orange: #f59e0b;
            --shadow: 0 18px 55px rgba(32,38,70,0.08);
        }
        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #171a2b, #242844);
            color: #fff;
            padding: 30px 6%;
        }
        .header h1 {
            font-size: 28px;
            letter-spacing: -0.5px;
        }
        .header p {
            color: #adb2c3;
            margin-top: 6px;
            font-size: 14px;
        }
        .container {
            width: min(1200px, 92%);
            margin: auto;
            padding: 30px 0 60px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(30,35,55,0.06);
            transition: transform 0.2s ease;
        }
        .stat-card:hover {
            transform: translateY(-3px);
        }
        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 14px;
        }
        .stat-icon.blue { background: rgba(99,91,255,0.1); }
        .stat-icon.green { background: rgba(24,166,106,0.1); }
        .stat-icon.orange { background: rgba(245,158,11,0.1); }
        .stat-icon.red { background: rgba(224,82,82,0.1); }
        .stat-icon.purple { background: rgba(139,92,246,0.1); }
        .stat-icon.teal { background: rgba(20,184,166,0.1); }
        .stat-value {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--text);
        }
        .stat-label {
            font-size: 13px;
            color: var(--muted);
            margin-top: 4px;
            font-weight: 600;
        }
        .section {
            background: var(--card);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(30,35,55,0.06);
            margin-bottom: 20px;
        }
        .section h2 {
            font-size: 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            text-align: left;
            padding: 12px 16px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            border-bottom: 1px solid #e9ebf1;
        }
        td {
            padding: 14px 16px;
            border-bottom: 1px solid #f0f0f5;
            color: #555c6c;
        }
        tr:hover td {
            background: #fafaff;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .badge-google {
            background: rgba(66,133,244,0.1);
            color: #4285f4;
        }
        .badge-email {
            background: rgba(99,91,255,0.1);
            color: var(--primary);
        }
        .badge-visit {
            background: rgba(24,166,106,0.1);
            color: var(--green);
        }
        .badge-guest {
            background: rgba(116,123,140,0.1);
            color: var(--muted);
        }
        .badge-pro {
            background: rgba(245,158,11,0.12);
            color: #f59e0b;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
        }
        .refresh-btn {
            float: right;
            padding: 8px 16px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .refresh-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99,91,255,0.25);
        }
        @media (max-width: 650px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            table { font-size: 12px; }
            th, td { padding: 10px 8px; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="header">
        <h1>📊 Panel de Control</h1>
        <p>Estadísticas de ¿Vale la pena?</p>
    </div>

    <div class="container">
        <div class="stats-grid" id="statsGrid">
            <div class="loading">Cargando estadísticas...</div>
        </div>

        <div class="section">
            <h2>👤 Usuarios Registrados <button class="refresh-btn" onclick="loadData()">🔄 Actualizar</button></h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Tipo</th>
                            <th>Plan</th>
                            <th>Análisis hoy</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="usersTable">
                        <tr><td colspan="5" class="loading">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="section">
            <h2>🌐 Últimas Visitas</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>IP</th>
                            <th>Página</th>
                            <th>Usuario</th>
                        </tr>
                    </thead>
                    <tbody id="visitsTable">
                        <tr><td colspan="4" class="loading">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <a href="/" class="back-link">← Volver al sitio</a>
    </div>

    <script>
        async function loadData() {
            try {
                const [statsRes, usersRes, visitsRes] = await Promise.all([
                    fetch("/api/admin/stats"),
                    fetch("/api/admin/users"),
                    fetch("/api/admin/visits")
                ]);

                const statsData = await statsRes.json();
                const usersData = await usersRes.json();
                const visitsData = await visitsRes.json();

                if (statsData.success) renderStats(statsData.stats);
                if (usersData.success) renderUsers(usersData.users);
                if (visitsData.success) renderVisits(visitsData.visits);
            } catch (e) {
                document.getElementById("statsGrid").innerHTML = "<p style='color:#e05252'>Error cargando datos</p>";
            }
        }

        function renderStats(s) {
            document.getElementById("statsGrid").innerHTML = `
                <div class="stat-card">
                    <div class="stat-icon blue">👁️</div>
                    <div class="stat-value">${s.totalVisits.toLocaleString()}</div>
                    <div class="stat-label">Visitas totales</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green">📅</div>
                    <div class="stat-value">${s.todayVisits.toLocaleString()}</div>
                    <div class="stat-label">Visitas hoy</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon purple">🧑‍💻</div>
                    <div class="stat-value">${s.uniqueVisitors.toLocaleString()}</div>
                    <div class="stat-label">Visitantes únicos</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon teal">👤</div>
                    <div class="stat-value">${s.totalUsers}</div>
                    <div class="stat-label">Usuarios registrados</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon orange">🔵</div>
                    <div class="stat-value">${s.googleUsers}</div>
                    <div class="stat-label">Con Google</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon red">📧</div>
                    <div class="stat-value">${s.emailUsers}</div>
                    <div class="stat-label">Con Email</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon orange">⭐</div>
                    <div class="stat-value">${s.proUsers}</div>
                    <div class="stat-label">Usuarios Pro</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background:rgba(99,91,255,0.1)">🆓</div>
                    <div class="stat-value">${s.freeUsers}</div>
                    <div class="stat-label">Usuarios Free</div>
                </div>
            `;
        }

        async function upgradeUser(id, plan) {
            try {
                const endpoint = plan === "pro" ? `/api/admin/users/${id}/upgrade` : `/api/admin/users/${id}/downgrade`;
                await fetch(endpoint, { method: "POST" });
                loadData();
            } catch (e) {
                alert("Error actualizando usuario");
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById("usersTable");
            if (!users.length) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#747b8c">No hay usuarios registrados</td></tr>';
                return;
            }
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td>#${u.id}</td>
                    <td><strong>${escapeHtml(u.name)}</strong></td>
                    <td>${escapeHtml(u.email)}</td>
                    <td><span class="badge ${u.google_id ? 'badge-google' : 'badge-email'}">${u.google_id ? 'Google' : 'Email'}</span></td>
                    <td><span class="badge ${u.plan === 'pro' ? 'badge-pro' : 'badge-guest'}">${u.plan === 'pro' ? '⭐ Pro' : '🆓 Free'}</span></td>
                    <td>${u.analysis_count || 0}/5</td>
                    <td>
                        <button onclick="upgradeUser(${u.id}, '${u.plan === 'pro' ? 'free' : 'pro'}')" 
                            style="padding:6px 12px;border:none;border-radius:8px;background:${u.plan === 'pro' ? '#e05252' : '#f59e0b'};color:#fff;font-size:12px;font-weight:700;cursor:pointer;">
                            ${u.plan === 'pro' ? 'Bajar a Free' : 'Subir a Pro'}
                        </button>
                    </td>
                </tr>
            `).join("");
        }

        function renderVisits(visits) {
            const tbody = document.getElementById("visitsTable");
            if (!visits.length) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#747b8c">No hay visitas registradas</td></tr>';
                return;
            }
            tbody.innerHTML = visits.map(v => `
                <tr>
                    <td>${formatDate(v.date)}</td>
                    <td>${v.ip}</td>
                    <td>${v.path}</td>
                    <td><span class="badge ${v.hasUser ? 'badge-visit' : 'badge-guest'}">${v.hasUser ? '👤 Usuario' : '👤 Invitado'}</span></td>
                </tr>
            `).join("");
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString("es-ES", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
        }

        loadData();
    </script>
</body>
</html>
