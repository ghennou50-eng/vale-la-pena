<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - هل يستحق الشراء؟</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f5f7fb;
            --card: #fff;
            --text: #171a26;
            --muted: #747b8c;
            --primary: #635bff;
            --green: #18a66a;
            --red: #e05252;
            --orange: #f59e0b;
            --shadow: 0 18px 55px rgba(32,38,70,0.08);
        }
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #171a2b, #242844);
            color: #fff;
            padding: 30px 6%;
        }
        .header h1 {
            font-size: 28px;
            letter-spacing: -0.5px;
        }
        .header p {
            color: #adb2c3;
            margin-top: 6px;
            font-size: 14px;
        }
        .container {
            width: min(1200px, 92%);
            margin: auto;
            padding: 30px 0 60px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(30,35,55,0.06);
            transition: transform 0.2s ease;
        }
        .stat-card:hover {
            transform: translateY(-3px);
        }
        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 14px;
        }
        .stat-icon.blue { background: rgba(99,91,255,0.1); }
        .stat-icon.green { background: rgba(24,166,106,0.1); }
        .stat-icon.orange { background: rgba(245,158,11,0.1); }
        .stat-icon.red { background: rgba(224,82,82,0.1); }
        .stat-icon.purple { background: rgba(139,92,246,0.1); }
        .stat-icon.teal { background: rgba(20,184,166,0.1); }
        .stat-value {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--text);
        }
        .stat-label {
            font-size: 13px;
            color: var(--muted);
            margin-top: 4px;
            font-weight: 600;
        }
        .section {
            background: var(--card);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(30,35,55,0.06);
            margin-bottom: 20px;
        }
        .section h2 {
            font-size: 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            text-align: right;
            padding: 12px 16px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            border-bottom: 1px solid #e9ebf1;
        }
        td {
            padding: 14px 16px;
            border-bottom: 1px solid #f0f0f5;
            color: #555c6c;
        }
        tr:hover td {
            background: #fafaff;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .badge-google {
            background: rgba(66,133,244,0.1);
            color: #4285f4;
        }
        .badge-email {
            background: rgba(99,91,255,0.1);
            color: var(--primary);
        }
        .badge-visit {
            background: rgba(24,166,106,0.1);
            color: var(--green);
        }
        .badge-guest {
            background: rgba(116,123,140,0.1);
            color: var(--muted);
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
        }
        .refresh-btn {
            float: left;
            padding: 8px 16px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .refresh-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99,91,255,0.25);
        }
        @media (max-width: 650px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            table { font-size: 12px; }
            th, td { padding: 10px 8px; }
        }
    </style>
<base target="_blank">
</head>
<body>
 <div class="header" style="display: flex; align-items: center; gap: 20px;">
    <img src="logo.png" alt="Logo" style="width: 50px; height: 50px; border-radius: 12px;">
    <div>
        <h1>📊 لوحة التحكم</h1>
        <p>إحصائيات موقع هل يستحق الشراء؟</p>
    </div>
</div>

    <div class="container">
        <div class="stats-grid" id="statsGrid">
            <div class="loading">جاري تحميل الإحصائيات...</div>
        </div>

        <div class="section">
            <h2>👤 المستخدمون المسجلون <button class="refresh-btn" onclick="loadData()">🔄 تحديث</button></h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>المعرف</th>
                            <th>الاسم</th>
                            <th>البريد الإلكتروني</th>
                            <th>نوع التسجيل</th>
                            <th>تاريخ التسجيل</th>
                        </tr>
                    </thead>
                    <tbody id="usersTable">
                        <tr><td colspan="5" class="loading">جاري التحميل...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="section">
            <h2>🌐 آخر الزيارات</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>التاريخ</th>
                            <th>عنوان IP</th>
                            <th>الصفحة</th>
                            <th>نوع الزائر</th>
                        </tr>
                    </thead>
                    <tbody id="visitsTable">
                        <tr><td colspan="4" class="loading">جاري التحميل...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <a href="/" class="back-link">← العودة إلى الموقع</a>
    </div>

    <script>
        async function loadData() {
            try {
                const [statsRes, usersRes, visitsRes] = await Promise.all([
                    fetch("/api/admin/stats"),
                    fetch("/api/admin/users"),
                    fetch("/api/admin/visits")
                ]);

                const statsData = await statsRes.json();
                const usersData = await usersRes.json();
                const visitsData = await visitsRes.json();

                if (statsData.success) renderStats(statsData.stats);
                if (usersData.success) renderUsers(usersData.users);
                if (visitsData.success) renderVisits(visitsData.visits);
            } catch (e) {
                document.getElementById("statsGrid").innerHTML = "<p style='color:#e05252'>خطأ في تحميل البيانات</p>";
            }
        }

        function renderStats(s) {
            document.getElementById("statsGrid").innerHTML = `
                <div class="stat-card">
                    <div class="stat-icon blue">👁️</div>
                    <div class="stat-value">${s.totalVisits.toLocaleString("ar-SA")}</div>
                    <div class="stat-label">إجمالي الزيارات</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green">📅</div>
                    <div class="stat-value">${s.todayVisits.toLocaleString("ar-SA")}</div>
                    <div class="stat-label">زيارات اليوم</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon purple">🧑‍💻</div>
                    <div class="stat-value">${s.uniqueVisitors.toLocaleString("ar-SA")}</div>
                    <div class="stat-label">زوار فريدون</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon teal">👤</div>
                    <div class="stat-value">${s.totalUsers.toLocaleString("ar-SA")}</div>
                    <div class="stat-label">مستخدمون مسجلون</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon orange">🔵</div>
                    <div class="stat-value">${s.googleUsers.toLocaleString("ar-SA")}</div>
                    <div class="stat-label">عبر Google</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon red">📧</div>
                    <div class="stat-value">${s.emailUsers.toLocaleString("ar-SA")}</div>
                    <div class="stat-label">عبر البريد</div>
                </div>
            `;
        }

        function renderUsers(users) {
            const tbody = document.getElementById("usersTable");
            if (!users.length) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#747b8c">لا يوجد مستخدمون مسجلون</td></tr>';
                return;
            }
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td>#${u.id}</td>
                    <td><strong>${escapeHtml(u.name)}</strong></td>
                    <td>${escapeHtml(u.email)}</td>
                    <td><span class="badge ${u.google_id ? 'badge-google' : 'badge-email'}">${u.google_id ? 'Google' : 'البريد'}</span></td>
                    <td>${formatDate(u.created_at)}</td>
                </tr>
            `).join("");
        }

        function renderVisits(visits) {
            const tbody = document.getElementById("visitsTable");
            if (!visits.length) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#747b8c">لا توجد زيارات مسجلة</td></tr>';
                return;
            }
            tbody.innerHTML = visits.map(v => `
                <tr>
                    <td>${formatDate(v.date)}</td>
                    <td>${v.ip}</td>
                    <td>${v.path}</td>
                    <td><span class="badge ${v.hasUser ? 'badge-visit' : 'badge-guest'}">${v.hasUser ? '👤 مستخدم' : '👤 زائر'}</span></td>
                </tr>
            `).join("");
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString("ar-SA", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
        }

        loadData();
    </script>
</body>
</html>
